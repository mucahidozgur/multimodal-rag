services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: multi-postgres
    environment:
      POSTGRES_USER: multi
      POSTGRES_PASSWORD: multi
      POSTGRES_DB: multi
    ports:
      - "5435:5432"
    volumes:
      - multi_pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multi"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: multi-api
    ports:
      - "8003:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://multi:multi@postgres:5432/multi
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - multi_hf_cache:/root/.cache/huggingface

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8003
    container_name: multi-web
    ports:
      - "3003:3000"
    depends_on:
      - api
    environment:
      NODE_ENV: production

volumes:
  multi_pgdata:
  multi_hf_cache:
